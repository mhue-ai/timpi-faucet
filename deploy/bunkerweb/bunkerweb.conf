# BunkerWeb config for Timpi Drip
# Cloudflare → BunkerWeb → Container (port 3000)

# Basic settings
SERVER_NAME=drip.clawpurse.ai
LISTEN_HTTP=yes
USE_REVERSE_PROXY=yes
REVERSE_PROXY_URL=/
REVERSE_PROXY_HOST=http://timpi-drip:3000

# Trust Cloudflare only (reject direct access)
USE_REALIP=yes
REALIP_FROM=173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32
REALIP_HEADER=CF-Connecting-IP

# Block non-Cloudflare traffic
USE_WHITELIST=yes
WHITELIST_IP=173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22

# HTTP methods (GET, POST, HEAD, OPTIONS only)
ALLOWED_METHODS=GET|POST|HEAD|OPTIONS

# Security headers (some handled by app, but defense in depth)
USE_SECURITY_HEADERS=yes
X_FRAME_OPTIONS=DENY
X_CONTENT_TYPE_OPTIONS=nosniff
REFERRER_POLICY=strict-origin-when-cross-origin

# WAF - ModSecurity with OWASP CRS
USE_MODSECURITY=yes
USE_MODSECURITY_CRS=yes
MODSECURITY_SEC_RULE_ENGINE=On

# Whitelist API endpoints from some CRS rules (PoW can trigger false positives)
MODSECURITY_CRS_EXCLUSIONS_DRUPAL=no
MODSECURITY_CRS_EXCLUSIONS_WORDPRESS=no
MODSECURITY_CRS_EXCLUSIONS_NEXTCLOUD=no

# Rate limiting (light - PoW already rate limits)
USE_LIMIT_REQ=yes
LIMIT_REQ_RATE=30r/s
LIMIT_REQ_BURST=60

# Stricter limit for drip endpoint
USE_LIMIT_REQ_URL=/api/drip
LIMIT_REQ_URL_RATE_/api/drip=5r/s
LIMIT_REQ_URL_BURST_/api/drip=10

# Bad behavior detection
USE_BAD_BEHAVIOR=yes
BAD_BEHAVIOR_STATUS_CODES=400 401 403 404 405 429 444
BAD_BEHAVIOR_BAN_TIME=3600
BAD_BEHAVIOR_THRESHOLD=20
BAD_BEHAVIOR_COUNT_TIME=60

# Anti-bot (light - we want CLI/agent access)
USE_ANTIBOT=no

# HTTPS redirect handled by Cloudflare
AUTO_LETS_ENCRYPT=no
USE_HTTPS=no

# Logging
LOG_LEVEL=warning
