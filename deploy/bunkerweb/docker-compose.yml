version: '3.8'

services:
  bunkerweb:
    image: bunkerity/bunkerweb:1.5.6
    container_name: bunkerweb
    restart: unless-stopped
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      # Core
      - SERVER_NAME=drip.clawpurse.ai
      - USE_REVERSE_PROXY=yes
      - REVERSE_PROXY_URL=/
      - REVERSE_PROXY_HOST=http://timpi-drip:3000
      
      # Trust Cloudflare only
      - USE_REALIP=yes
      - REALIP_FROM=173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22
      - REALIP_HEADER=CF-Connecting-IP
      
      # Whitelist Cloudflare IPs only
      - USE_WHITELIST=yes
      - WHITELIST_IP=173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22
      
      # Methods
      - ALLOWED_METHODS=GET|POST|HEAD|OPTIONS
      
      # WAF
      - USE_MODSECURITY=yes
      - USE_MODSECURITY_CRS=yes
      
      # Rate limiting
      - USE_LIMIT_REQ=yes
      - LIMIT_REQ_RATE=30r/s
      - LIMIT_REQ_BURST=60
      
      # Bad behavior
      - USE_BAD_BEHAVIOR=yes
      - BAD_BEHAVIOR_THRESHOLD=20
      - BAD_BEHAVIOR_BAN_TIME=3600
      
      # Anti-bot OFF (allow CLI/agents)
      - USE_ANTIBOT=no
      
      # No SSL here (Cloudflare handles)
      - AUTO_LETS_ENCRYPT=no
      - USE_HTTPS=no
      
    networks:
      - drip-net
    depends_on:
      - timpi-drip

  timpi-drip:
    build: ../..
    container_name: timpi-drip
    restart: unless-stopped
    # No ports exposed - only via BunkerWeb
    volumes:
      - drip-data:/app/data
    environment:
      - FAUCET_WALLET_PASSWORD=${FAUCET_WALLET_PASSWORD:?Required}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Required}
      - KEYSTORE_PATH=/app/data/keystore.enc
      - DB_PATH=/app/data/faucet.db
      # Admin allowlist - add your IP (via Cloudflare)
      - ADMIN_IP_ALLOWLIST=${ADMIN_IP_ALLOWLIST:-127.0.0.1}
      - DRIP_AMOUNT_NEW=${DRIP_AMOUNT_NEW:-0.5}
      - DRIP_AMOUNT_TRUSTED=${DRIP_AMOUNT_TRUSTED:-1.0}
      - COOLDOWN_NEW=${COOLDOWN_NEW:-48}
      - COOLDOWN_TRUSTED=${COOLDOWN_TRUSTED:-24}
      - POW_DIFFICULTY=${POW_DIFFICULTY:-4}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - drip-net

volumes:
  drip-data:
    name: timpi-drip-data

networks:
  drip-net:
    name: timpi-drip-net
