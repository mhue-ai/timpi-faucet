version: '3.8'

services:
  timpi-drip:
    build: .
    container_name: timpi-drip
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - drip-data:/app/data
      - ${KEYSTORE_PATH:-./keystore}:/app/keystore:ro
    environment:
      - NODE_ENV=production
      - FAUCET_WALLET_PASSWORD=${FAUCET_WALLET_PASSWORD:?Wallet password required}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Admin password required}
      - KEYSTORE_PATH=/app/keystore/keystore.enc
      - DB_PATH=/app/data/faucet.db
      - ADMIN_IP_ALLOWLIST=${ADMIN_IP_ALLOWLIST:-127.0.0.1,::1}
      - DISCORD_WEBHOOK=${DISCORD_WEBHOOK:-}
      - ALERT_EMAIL=${ALERT_EMAIL:-}
      - DRIP_AMOUNT_NEW=${DRIP_AMOUNT_NEW:-0.5}
      - DRIP_AMOUNT_TRUSTED=${DRIP_AMOUNT_TRUSTED:-1.0}
      - COOLDOWN_NEW=${COOLDOWN_NEW:-48}
      - COOLDOWN_TRUSTED=${COOLDOWN_TRUSTED:-24}
      - POW_DIFFICULTY=${POW_DIFFICULTY:-4}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - faucet-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  drip-data:

networks:
  faucet-net:
